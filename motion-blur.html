<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Blur - 画像にモーションブラーをかける</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 0;
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    header p {
      color: #8892b0;
      font-size: 1.1rem;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 30px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .canvas-area {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .drop-zone {
      width: 100%;
      height: 400px;
      border: 3px dashed rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #00d2ff;
      background: rgba(0, 210, 255, 0.1);
    }

    .drop-zone svg {
      width: 80px;
      height: 80px;
      fill: rgba(255, 255, 255, 0.5);
      margin-bottom: 20px;
    }

    .drop-zone p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
      text-align: center;
    }

    .drop-zone.hidden {
      display: none;
    }

    #previewCanvas {
      max-width: 100%;
      max-height: 500px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    #previewCanvas.hidden {
      display: none;
    }

    .controls {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 25px;
    }

    .control-group {
      margin-bottom: 25px;
    }

    .control-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
      color: #ccd6f6;
    }

    .control-group .value {
      float: right;
      color: #00d2ff;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 210, 255, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 10px rgba(0, 210, 255, 0.5);
    }

    .angle-preview {
      width: 80px;
      height: 80px;
      margin: 15px auto;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
      background: rgba(255, 255, 255, 0.05);
    }

    .angle-preview::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 35px;
      height: 3px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      transform-origin: left center;
      border-radius: 2px;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .processing {
      display: none;
      text-align: center;
      padding: 20px;
      color: #8892b0;
    }

    .processing.active {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00d2ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .file-input {
      display: none;
    }

    .quality-select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .quality-select option {
      background: #1a1a2e;
      color: white;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #8892b0;
      font-size: 0.9rem;
    }

    footer a {
      color: #00d2ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Motion Blur</h1>
      <p>画像にモーションブラー効果を適用できます</p>
    </header>

    <div class="main-content">
      <div class="canvas-area">
        <div class="drop-zone" id="dropZone">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
          </svg>
          <p>クリックまたはドラッグ&ドロップで<br>画像をアップロード</p>
        </div>
        <canvas id="previewCanvas" class="hidden"></canvas>
        <input type="file" id="fileInput" class="file-input" accept="image/*">
        <div class="processing" id="processing">
          <div class="spinner"></div>
          <p>処理中...</p>
        </div>
      </div>

      <div class="controls">
        <div class="control-group">
          <label>
            ブラーの角度
            <span class="value" id="angleValue">0°</span>
          </label>
          <input type="range" id="angleSlider" min="0" max="360" value="0">
          <div class="angle-preview" id="anglePreview"></div>
        </div>

        <div class="control-group">
          <label>
            ブラーの強度
            <span class="value" id="intensityValue">20</span>
          </label>
          <input type="range" id="intensitySlider" min="1" max="100" value="20">
        </div>

        <div class="control-group">
          <label>
            サンプル数（品質）
            <span class="value" id="samplesValue">15</span>
          </label>
          <input type="range" id="samplesSlider" min="5" max="50" value="15">
        </div>

        <div class="control-group">
          <label>出力形式</label>
          <select class="quality-select" id="formatSelect">
            <option value="png">PNG（高品質・透明対応）</option>
            <option value="jpeg">JPEG（小さいファイルサイズ）</option>
            <option value="webp">WebP（高効率圧縮）</option>
          </select>
        </div>

        <button class="btn btn-primary" id="applyBtn" disabled>モーションブラーを適用</button>
        <button class="btn btn-primary" id="downloadBtn" disabled>画像をダウンロード</button>
        <button class="btn btn-secondary" id="resetBtn">リセット</button>
      </div>
    </div>

    <footer>
      <p><a href="index.html">トップページに戻る</a></p>
    </footer>
  </div>

  <script>
    // DOM Elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const processing = document.getElementById('processing');

    const angleSlider = document.getElementById('angleSlider');
    const angleValue = document.getElementById('angleValue');
    const anglePreview = document.getElementById('anglePreview');

    const intensitySlider = document.getElementById('intensitySlider');
    const intensityValue = document.getElementById('intensityValue');

    const samplesSlider = document.getElementById('samplesSlider');
    const samplesValue = document.getElementById('samplesValue');

    const formatSelect = document.getElementById('formatSelect');

    const applyBtn = document.getElementById('applyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    // State
    let originalImage = null;
    let processedImageData = null;

    // Event Listeners for file upload
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith('image/')) {
        loadImage(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        loadImage(e.target.files[0]);
      }
    });

    // Load image
    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;

          // Set canvas size
          previewCanvas.width = img.width;
          previewCanvas.height = img.height;

          // Draw original image
          ctx.drawImage(img, 0, 0);

          // Show canvas, hide drop zone
          dropZone.classList.add('hidden');
          previewCanvas.classList.remove('hidden');

          // Enable apply button
          applyBtn.disabled = false;
          processedImageData = null;
          downloadBtn.disabled = true;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Update angle preview
    function updateAnglePreview() {
      const angle = angleSlider.value;
      angleValue.textContent = angle + '°';
      anglePreview.style.setProperty('--angle', angle + 'deg');
      anglePreview.querySelector('::after') || (anglePreview.style.cssText = `--angle: ${angle}deg`);
      document.documentElement.style.setProperty('--blur-angle', angle + 'deg');

      // Update the pseudo-element rotation
      const styleSheet = document.styleSheets[0];
      for (let i = 0; i < styleSheet.cssRules.length; i++) {
        if (styleSheet.cssRules[i].selectorText === '.angle-preview::after') {
          styleSheet.cssRules[i].style.transform = `rotate(${angle}deg)`;
          break;
        }
      }
    }

    angleSlider.addEventListener('input', updateAnglePreview);
    updateAnglePreview();

    intensitySlider.addEventListener('input', () => {
      intensityValue.textContent = intensitySlider.value;
    });

    samplesSlider.addEventListener('input', () => {
      samplesValue.textContent = samplesSlider.value;
    });

    // Apply motion blur
    applyBtn.addEventListener('click', () => {
      if (!originalImage) return;

      processing.classList.add('active');
      applyBtn.disabled = true;

      // Use setTimeout to allow UI to update
      setTimeout(() => {
        applyMotionBlur();
        processing.classList.remove('active');
        applyBtn.disabled = false;
        downloadBtn.disabled = false;
      }, 50);
    });

    function applyMotionBlur() {
      const angle = parseFloat(angleSlider.value);
      const intensity = parseFloat(intensitySlider.value);
      const samples = parseInt(samplesSlider.value);

      const width = originalImage.width;
      const height = originalImage.height;

      // Create temporary canvas for processing
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width;
      tempCanvas.height = height;
      const tempCtx = tempCanvas.getContext('2d');

      // Clear main canvas
      ctx.clearRect(0, 0, width, height);

      // Calculate direction vector
      const radians = (angle * Math.PI) / 180;
      const dx = Math.cos(radians);
      const dy = Math.sin(radians);

      // Draw multiple offset copies with transparency
      ctx.globalAlpha = 1 / samples;

      for (let i = 0; i < samples; i++) {
        const offset = (i - samples / 2) * (intensity / samples);
        const offsetX = dx * offset;
        const offsetY = dy * offset;

        ctx.drawImage(originalImage, offsetX, offsetY);
      }

      ctx.globalAlpha = 1;

      processedImageData = previewCanvas.toDataURL(`image/${formatSelect.value}`, 0.92);
    }

    // Download
    downloadBtn.addEventListener('click', () => {
      if (!processedImageData) return;

      const format = formatSelect.value;
      const link = document.createElement('a');
      link.download = `motion-blur-image.${format}`;
      link.href = processedImageData;
      link.click();
    });

    // Reset
    resetBtn.addEventListener('click', () => {
      originalImage = null;
      processedImageData = null;

      ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

      dropZone.classList.remove('hidden');
      previewCanvas.classList.add('hidden');

      applyBtn.disabled = true;
      downloadBtn.disabled = true;

      fileInput.value = '';

      angleSlider.value = 0;
      intensitySlider.value = 20;
      samplesSlider.value = 15;

      updateAnglePreview();
      intensityValue.textContent = '20';
      samplesValue.textContent = '15';
    });
  </script>
</body>
</html>
